<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173A2D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="First Serve">
  <link rel="manifest" href="manifest.json">
<title>First Serve Pickleball</title>
<style>
  :root{
    --court:#1E3A6E;
    --court-dark:#122950;
    --bg:#F2F4F7;
    --card:#FFFFFF;
    --ball:#E9EDF3;
    --ball-dark:#C7D0DE;
    --accent:#3E62A6;
    --ink:#1B2432;
    --muted:#78828F;
    --coral:#5B6572;
    --line:#E1E5EB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  header{
    background:var(--court);
    color:#fff;
    padding:20px 18px 24px;
    border-bottom-left-radius:18px;
    border-bottom-right-radius:18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header img{
    width:52px;
    height:52px;
    border-radius:12px;
    background:#fff;
    padding:4px;
    flex-shrink:0;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:800;
    letter-spacing:0.3px;
    margin:0 0 2px;
    font-size:21px;
    line-height:1.15;
  }
  header p{margin:0;color:#C5D0E3;font-size:12px;}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px;}
  section{margin-top:18px;}
  h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--muted);
    margin:0 0 8px;
    font-weight:700;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:14px;
    box-shadow:0 1px 3px rgba(27,43,38,0.08);
    margin-bottom:10px;
  }
  .row{display:flex;gap:8px;}
  input[type=text], input[type=number]{
    flex:1;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    background:#fff;
    color:var(--ink);
  }
  button{
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    padding:11px 16px;
    border-radius:10px;
  }
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--coral);
    padding:6px 8px;
    font-size:13px;
  }
  .btn-shuffle{
    width:100%;
    background:var(--court);
    color:#fff;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    letter-spacing:0.3px;
  }
  .btn-shuffle:disabled{background:#AEB6C2;cursor:not-allowed;}
  .player-chip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 4px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .player-chip:last-child{border-bottom:none;}
  .stat{color:var(--muted);font-size:12px;}
  .court-card{
    background:var(--court);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .court-card .court-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ball);
    font-weight:700;
    margin-bottom:8px;
  }
  .court-lines{
    border:2px solid rgba(255,255,255,0.35);
    border-radius:8px;
    padding:10px;
    position:relative;
  }
  .court-lines::before{
    content:"";
    position:absolute;
    left:50%;top:8%;bottom:8%;
    width:2px;
    background:rgba(255,255,255,0.35);
    transform:translateX(-50%);
  }
  .teams{display:flex;justify-content:space-between;gap:10px;}
  .team{flex:1;text-align:center;}
  .team-name{font-weight:800;font-size:15px;line-height:1.3;}
  .team-name span{display:block;font-weight:500;font-size:13px;color:#DCE9E2;}
  .vs{
    align-self:center;
    font-size:11px;
    color:var(--ball);
    font-weight:800;
  }
  .winbtns{display:flex;gap:8px;margin-top:12px;}
  .winbtns button{
    flex:1;
    padding:9px;
    border-radius:8px;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-size:13px;
  }
  .winbtns button:active{background:var(--ball);color:var(--court-dark);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    color:var(--muted);
    padding:4px 6px;
    letter-spacing:0.5px;
  }
  td{padding:8px 6px;border-top:1px solid var(--line);}
  .rank{color:var(--muted);width:20px;}
  .lb-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 1px 3px rgba(27,43,38,0.08);
  }
  .lb-rank{
    font-size:22px;
    width:34px;
    text-align:center;
    flex-shrink:0;
    font-weight:800;
    color:var(--muted);
  }
  .lb-info{flex:1;min-width:0;}
  .lb-name{font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px;}
  .lb-bar-track{
    height:6px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:4px;
  }
  .lb-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:4px;
  }
  .lb-stats{font-size:12px;color:var(--muted);}
  .lb-pct{
    font-size:20px;
    font-weight:800;
    color:var(--court);
    flex-shrink:0;
  }
  .lb-pct span{font-size:12px;font-weight:600;}

    background-position:center 40vh;
    background-size:340px;
    background-attachment:fixed;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(242,244,247,0.94);
    z-index:-1;
  }
  .queue-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 4px;
    font-size:14px;
  }
  .qnum{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .empty{color:var(--muted);font-size:14px;padding:8px 2px;}
  .note{font-size:12px;color:var(--muted);margin-top:6px;}
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(18,41,80,0.55);
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:16px;
    padding:20px;
    width:100%;
    max-width:320px;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .modal-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .modal-message{font-size:14px;color:var(--muted);line-height:1.4;margin-bottom:12px;}
  .modal-input{
    display:none;
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
  .modal-btns button{padding:10px 16px;border-radius:9px;font-size:14px;}
  .modal-btn-cancel{background:var(--ball);color:var(--court-dark);}
  .modal-btn-confirm{background:var(--accent);color:#fff;}
</style>

<div class="wrap">

  <section>
    <h2>Players</h2>
    <div class="card">
      <div class="row">
        <input type="text" id="nameInput" placeholder="Add player name" />
        <button class="btn-primary" onclick="addPlayer()">Add</button>
      </div>
      <div id="playerList" style="margin-top:8px;"></div>
    </div>
  </section>

  <section>
    <h2>Setup</h2>
    <div class="card row" style="align-items:center;">
      <span style="font-size:14px;">Courts available</span>
      <input type="number" id="courtsInput" value="1" min="1" max="8" style="max-width:70px;" onchange="saveSettings()">
    </div>
    <button class="btn-shuffle" id="shuffleBtn" onclick="shuffle()">🔀 Shuffle Next Round</button>
    <div class="note" id="shuffleNote"></div>
  </section>

  <section id="matchesSection" style="display:none;">
    <h2>On Court — Round <span id="roundNum"></span></h2>
    <div id="matchesList"></div>
  </section>

  <section>
    <h2>Next Up</h2>
    <div class="card" id="queueCard"><div class="empty">Add players and shuffle to build a queue.</div></div>
  </section>

  <section>
    <h2>🏆 Leaderboard</h2>
    <div id="leaderboard"></div>
  </section>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <input type="text" id="modalInput" class="modal-input">
    <div class="modal-btns">
      <button class="modal-btn-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-btn-confirm" id="modalConfirmBtn">OK</button>
    </div>
  </div>
</div>

<script>
let state = {
  players: [],   // {id, name, wins, losses, games}
  courts: 1,
  round: 0,
  matches: [],   // {court, teamA:[id,id], teamB:[id,id]}
  queue: []      // ids waiting, in next-up order
};

function uid(){ return Math.random().toString(36).slice(2,9); }

// --- Custom modal (replaces prompt/alert, which get blocked in sandboxed viewers) ---
let modalResolve = null;
function showModal({title='', message='', hasInput=false, inputType='text', placeholder='', showCancel=true, confirmLabel='OK', cancelLabel='Cancel'}){
  return new Promise(resolve => {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    const input = document.getElementById('modalInput');
    input.style.display = hasInput ? 'block' : 'none';
    input.type = inputType;
    input.placeholder = placeholder;
    input.value = '';
    document.getElementById('modalCancelBtn').style.display = showCancel ? 'inline-block' : 'none';
    document.getElementById('modalConfirmBtn').textContent = confirmLabel;
    document.getElementById('modalCancelBtn').textContent = cancelLabel;
    document.getElementById('modalOverlay').classList.add('open');
    modalResolve = resolve;
    if(hasInput){ setTimeout(() => input.focus(), 50); }
  });
}
function closeModal(result){
  document.getElementById('modalOverlay').classList.remove('open');
  if(modalResolve){ modalResolve(result); modalResolve = null; }
}
document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  const input = document.getElementById('modalInput');
  closeModal(input.style.display !== 'none' ? input.value : true);
});
document.getElementById('modalCancelBtn').addEventListener('click', () => closeModal(null));
document.getElementById('modalInput').addEventListener('keypress', e => {
  if(e.key === 'Enter'){ document.getElementById('modalConfirmBtn').click(); }
});

function load(){
  try{
    const saved = localStorage.getItem('pickleball-state');
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed && typeof parsed === 'object'){
        state = {
          players: Array.isArray(parsed.players) ? parsed.players : [],
          courts: Number(parsed.courts) || 1,
          round: Number(parsed.round) || 0,
          matches: Array.isArray(parsed.matches) ? parsed.matches : [],
          queue: Array.isArray(parsed.queue) ? parsed.queue : []
        };
      }
    }
  }catch(e){
    console.error('Load failed:', e);
  }
  render();
}

function save(){
  try{
    localStorage.setItem('pickleball-state', JSON.stringify(state));
  }catch(e){
    console.error('Save failed:', e);
  }
}

function addPlayer(){
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return;
  state.players.push({id: uid(), name, wins:0, losses:0, games:0});
  input.value = '';
  save(); render();
}

function removePlayer(id){
  state.players = state.players.filter(p => p.id !== id);
  state.queue = state.queue.filter(qid => qid !== id);
  state.matches = state.matches.filter(m => ![...m.teamA, ...m.teamB].includes(id));
  save(); render();
}

function saveSettings(){
  const v = parseInt(document.getElementById('courtsInput').value) || 1;
  state.courts = v;
  save();
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shuffle(){
  if(state.matches.length > 0){
    showModal({title:'Tapusin muna', message:'Kumpletuhin munang i-declare ang panalo sa kasalukuyang round bago mag-shuffle ulit.', showCancel:false});
    return;
  }
  const courts = Math.max(1, parseInt(document.getElementById('courtsInput').value) || 1);
  state.courts = courts;
  if(state.players.length < 4){
    showModal({title:'Kulang ang players', message:'Kailangan ng hindi bababa sa 4 na players para makapagsimula.', showCancel:false});
    return;
  }
  const maxCourts = Math.min(courts, Math.floor(state.players.length/4));

  // sort by fewest games played (fair rotation), randomize within same-games groups
  const byGames = {};
  state.players.forEach(p => { (byGames[p.games] = byGames[p.games]||[]).push(p); });
  const games = Object.keys(byGames).map(Number).sort((a,b)=>a-b);
  let ordered = [];
  games.forEach(g => { ordered = ordered.concat(shuffleArray(byGames[g])); });

  const playing = ordered.slice(0, maxCourts*4);
  const waiting = ordered.slice(maxCourts*4);

  state.matches = [];
  for(let c=0; c<maxCourts; c++){
    const four = shuffleArray(playing.slice(c*4, c*4+4));
    state.matches.push({
      court: c+1,
      teamA: [four[0].id, four[1].id],
      teamB: [four[2].id, four[3].id]
    });
  }
  state.queue = waiting.map(p => p.id);
  state.round += 1;
  save(); render();
}

function playerName(id){
  const p = state.players.find(p => p.id === id);
  return p ? p.name : '—';
}

function recordWin(courtIdx, winner){
  const m = state.matches[courtIdx];
  const winIds = winner === 'A' ? m.teamA : m.teamB;
  const loseIds = winner === 'A' ? m.teamB : m.teamA;
  winIds.forEach(id => { const p = state.players.find(x=>x.id===id); if(p){ p.wins++; p.games++; } });
  loseIds.forEach(id => { const p = state.players.find(x=>x.id===id); if(p){ p.losses++; p.games++; } });
  state.matches.splice(courtIdx, 1);
  save(); render();
}

function render(){
  const courtsInput = document.getElementById('courtsInput');
  if(document.activeElement !== courtsInput){ courtsInput.value = state.courts; }

  // players
  const pl = document.getElementById('playerList');
  if(state.players.length === 0){
    pl.innerHTML = '<div class="empty">No players yet — add a few above.</div>';
  } else {
    pl.innerHTML = state.players.map(p => `
      <div class="player-chip">
        <span>${escapeHtml(p.name)} <span class="stat">(${p.games} games)</span></span>
        <button class="btn-ghost" onclick="removePlayer('${p.id}')">Remove</button>
      </div>
    `).join('');
  }

  // shuffle button + note
  const shuffleBtn = document.getElementById('shuffleBtn');
  const note = document.getElementById('shuffleNote');
  const canShuffle = state.players.length >= 4 && state.matches.length === 0;
  shuffleBtn.disabled = !canShuffle;
  if(state.players.length < 4){
    note.textContent = `Add ${4 - state.players.length} more player(s) to start.`;
  } else if(state.matches.length > 0){
    note.textContent = 'Declare winners for all courts below before shuffling again.';
  } else {
    note.textContent = '';
  }

  // matches
  const matchesSection = document.getElementById('matchesSection');
  const matchesList = document.getElementById('matchesList');
  if(state.matches.length > 0){
    matchesSection.style.display = 'block';
    document.getElementById('roundNum').textContent = state.round;
    matchesList.innerHTML = state.matches.map((m, i) => `
      <div class="court-card">
        <div class="court-label">Court ${m.court}</div>
        <div class="court-lines">
          <div class="teams">
            <div class="team">
              <div class="team-name">${escapeHtml(playerName(m.teamA[0]))}<span>${escapeHtml(playerName(m.teamA[1]))}</span></div>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <div class="team-name">${escapeHtml(playerName(m.teamB[0]))}<span>${escapeHtml(playerName(m.teamB[1]))}</span></div>
            </div>
          </div>
        </div>
        <div class="winbtns">
          <button onclick="recordWin(${i}, 'A')">Team A won</button>
          <button onclick="recordWin(${i}, 'B')">Team B won</button>
        </div>
      </div>
    `).join('');
  } else {
    matchesSection.style.display = 'none';
  }

  // queue / next up
  const queueCard = document.getElementById('queueCard');
  if(state.queue.length > 0){
    queueCard.innerHTML = state.queue.map((id, i) => `
      <div class="queue-item"><span class="qnum">${i+1}</span> ${escapeHtml(playerName(id))}</div>
    `).join('');
  } else {
    queueCard.innerHTML = '<div class="empty">Add players and shuffle to build a queue.</div>';
  }

  // leaderboard
  const board = document.getElementById('leaderboard');
  const sorted = state.players.slice().sort((a,b) => (b.wins - a.wins) || (a.losses - b.losses));
  if(sorted.length === 0){
    board.innerHTML = '<div class="card"><div class="empty">No games played yet.</div></div>';
  } else {
    board.innerHTML = sorted.map((p,i) => {
      const winPct = p.games > 0 ? Math.round((p.wins / p.games) * 100) : 0;
      return `
        <div class="lb-card">
          <div class="lb-rank">${i+1}</div>
          <div class="lb-info">
            <div class="lb-name">${escapeHtml(p.name)}</div>
            <div class="lb-bar-track"><div class="lb-bar-fill" style="width:${winPct}%;"></div></div>
            <div class="lb-stats">${p.wins}W · ${p.losses}L · ${p.games} games</div>
          </div>
          <div class="lb-pct">${winPct}<span>%</span></div>
        </div>
      `;
    }).join('');
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('nameInput').addEventListener('keypress', e => {
  if(e.key === 'Enter') addPlayer();
});

load();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}

// --- Local backup / restore helpers ---
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'first-serve-pickleball-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importBackupFile(file){
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!imported || !Array.isArray(imported.players)) throw new Error('Invalid backup');
    state = {
      players: imported.players,
      courts: Number(imported.courts) || 1,
      round: Number(imported.round) || 0,
      matches: Array.isArray(imported.matches) ? imported.matches : [],
      queue: Array.isArray(imported.queue) ? imported.queue : []
    };
    save();
    render();
  }catch(e){
    console.error('Import failed:', e);
    await showModal({
      title:'Import failed',
      message:'The selected file is not a valid First Serve Pickleball backup.',
      showCancel:false,
      confirmLabel:'OK'
    });
  }
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    if(input.files && input.files[0]) importBackupFile(input.files[0]);
  };
  input.click();
}

</script>
